name: Android Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (contoh: 1.0.1)"
        required: true
        default: "1.0.0"
      upload_release:
        description: "Upload GitHub Release?"
        required: true
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set Version
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ github.event.inputs.version_name }}\"/" app/build.gradle

      - name: Build Release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload GitHub Release
        if: ${{ github.event.inputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version_name }}
          files: app/build/outputs/apk/release/*.apk
