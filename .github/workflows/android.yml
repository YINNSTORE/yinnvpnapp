name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name"
        required: true
        default: "1.0.0"

      upload_release:
        description: "Upload GitHub Release"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

# 🔑 WAJIB agar bisa bikin GitHub Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          ls -lah app/release.keystore

      - name: Verify keystore
        run: |
          keytool -list \
            -keystore app/release.keystore \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null

      - name: Create signing.properties
        run: |
          cat > signing.properties <<EOF
          keystore.path=release.keystore
          keystore.password=${{ secrets.KEYSTORE_PASSWORD }}
          key.alias=${{ secrets.KEY_ALIAS }}
          key.password=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Set versionName
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ inputs.version_name }}\"/" app/build.gradle

      - name: Build Release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      # 🔥 CLEAN GitHub Release
      - name: Publish GitHub Release
        if: ${{ inputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version_name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true