name: Android Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (contoh: 1.0.1)"
        required: true
        default: "1.0.0"

      upload_release:
        description: "Upload to GitHub Release?"
        required: true
        type: choice
        options: ["false", "true"]
        default: "false"

jobs:
  BuildRelease:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 🔐 Decode keystore (ROOT, bukan app/)
      - name: Decode release keystore
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          ls -lah release.keystore

      # 🔍 Verifikasi keystore (WAJIB)
      - name: Verify keystore
        shell: bash
        run: |
          keytool -list -keystore release.keystore \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null
          echo "Keystore OK ✅"

      # 🧾 Buat signing.properties
      - name: Create signing.properties
        shell: bash
        run: |
          cat > signing.properties <<EOF2
          keystore.path=release.keystore
          keystore.password=${{ secrets.KEYSTORE_PASSWORD }}
          key.alias=${{ secrets.KEY_ALIAS }}
          key.password=${{ secrets.KEY_PASSWORD }}
          EOF2
          cat signing.properties

      - name: Set version
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ inputs.version_name }}\"/" app/build.gradle

      - name: Build Release
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload GitHub Release
        if: ${{ inputs.upload_release == 'true' && success() }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version_name }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
