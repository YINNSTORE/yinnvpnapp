name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (contoh: 1.0.1)"
        required: true
        default: "1.0.0"

      upload_release:
        description: "Upload ke GitHub Release?"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # Java 17 (WAJIB)
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # =========================
      # Decode keystore KE app/
      # =========================
      - name: Decode release keystore
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          ls -lah app/release.keystore

      # =========================
      # Verify keystore (ANTI GAGAL DI AKHIR)
      # =========================
      - name: Verify keystore
        shell: bash
        run: |
          keytool -list \
            -keystore app/release.keystore \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null
          echo "Keystore OK ✅"

      # =========================
      # Buat signing.properties
      # =========================
      - name: Create signing.properties
        shell: bash
        run: |
          cat > signing.properties <<EOF
          keystore.path=release.keystore
          keystore.password=${{ secrets.KEYSTORE_PASSWORD }}
          key.alias=${{ secrets.KEY_ALIAS }}
          key.password=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "signing.properties created"

      # =========================
      # Set versionName
      # =========================
      - name: Set versionName
        shell: bash
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ inputs.version_name }}\"/" app/build.gradle

      # =========================
      # Build Release
      # =========================
      - name: Assemble Release
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      # =========================
      # Upload Artifact
      # =========================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      # =========================
      # Optional GitHub Release
      # =========================
      - name: Upload GitHub Release
        if: ${{ inputs.upload_release == 'true' && success() }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version_name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}